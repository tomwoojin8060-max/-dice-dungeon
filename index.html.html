<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주사위 던전: 운명을 설계하라</title><style>
:root{color-scheme:dark;--bg:#0c1020;--panel:#171d30;--line:#303a55;--gold:#f5c96b;--txt:#e9eefb;--muted:#a9b5ce;--blue:#75baff;--red:#ff8190;--green:#8ae3b2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#202b4c,#0b0e1a 75%);font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:var(--txt)}main{max-width:1050px;margin:auto;padding:22px 14px 65px}h1{margin:0;color:var(--gold);font-size:clamp(24px,5vw,36px)}h2{font-size:19px;margin:0 0 12px}p{line-height:1.55}.sub{color:var(--muted);margin:5px 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{background:#171e31ed;border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px;box-shadow:0 7px 24px #0002}.wide{grid-column:1/-1}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.spread{justify-content:space-between}.tag{display:inline-block;background:#28334e;border:1px solid #425273;padding:4px 9px;border-radius:100px;font-size:12px;color:#d4e1ff}.stat{font-size:14px;color:var(--muted)}.stat b{color:white}button{cursor:pointer;background:#2b3a5a;border:1px solid #53688e;color:white;border-radius:10px;padding:11px 13px;font:inherit;font-weight:650;transition:.12s}button:hover:not(:disabled){background:#39517c;transform:translateY(-1px)}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#92702e;border-color:#e5b95d;color:#fff}.primary:hover:not(:disabled){background:#ac8638}.danger{background:#603041;border-color:#a85a6c}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px}.card{border:1px solid #40506e;background:#202b44;border-radius:12px;padding:14px;text-align:left;min-height:115px}.card strong{display:block;color:var(--gold);margin-bottom:6px}.card small{display:block;color:var(--muted);font-weight:400;line-height:1.5}.card.selected{outline:2px solid var(--gold)}.bar{height:11px;background:#3c3042;border-radius:20px;overflow:hidden;margin:8px 0}.fill{height:100%;background:linear-gradient(90deg,#e45f73,#ff9a8c)}.enemy .fill{background:linear-gradient(90deg,#b44a60,#f36d7b)}.meter{height:7px;background:#344158;border-radius:20px;overflow:hidden;margin-top:5px}.meter span{display:block;height:100%;background:var(--blue)}.log{height:220px;overflow:auto;background:#0e1425;border-radius:10px;padding:11px;font-size:13px;line-height:1.75}.log div{border-bottom:1px solid #ffffff0c;padding:4px}.log div:first-child{color:#ffdb87}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.actions button{min-height:65px;text-align:left}.actions small{display:block;font-weight:400;color:#c4cfe2;margin-top:3px}.die{display:inline-grid;place-items:center;width:54px;height:54px;border-radius:12px;background:#e9edf9;color:#19233c;font-size:27px;font-weight:900;box-shadow:0 4px 0 #99a9c8}.highlight{color:var(--gold)}.muted{color:var(--muted)}.hidden{display:none!important}.item{padding:8px 10px;border:1px solid #3b4864;border-radius:9px;margin:6px 0;background:#202941;font-size:13px}.footer{font-size:12px;color:#8f9dbb;text-align:center;margin-top:24px}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#3b4e72;padding:12px 18px;border:1px solid #7187b0;border-radius:12px;display:none;max-width:90%;z-index:5}@media(max-width:680px){.grid{grid-template-columns:1fr}.panel{padding:13px}.actions{grid-template-columns:1fr 1fr}.actions button{font-size:13px;padding:10px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.card{padding:10px}}
</style></head><body><main><header><h1>🎲 주사위 던전</h1><p class="sub">운명을 설계하라 · D20 TRPG 로그라이크</p></header><div id="app"></div><p class="footer">자동 저장 · 브라우저 로컬 저장 · 오프라인 플레이 가능 · v1.0</p></main><div id="toast"></div><script>
'use strict';const $=s=>document.querySelector(s),rand=n=>Math.floor(Math.random()*n),roll=()=>rand(20)+1,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const classes=[{id:'warrior',name:'⚔️ 전사',desc:'힘 +3. 기본 공격이 강하고 안정적이다.',hp:36,str:3,def:0,focus:2,skill:'강타'},{id:'rogue',name:'🗡️ 도적',desc:'공격 성공 시 고정 피해 +3. 재굴림 1회 추가.',hp:27,str:1,def:1,focus:3,skill:'급소 공격'},{id:'guardian',name:'🛡️ 수호자',desc:'방어 +4. 방어 성공 시 적에게 반격 3.',hp:42,str:0,def:4,focus:2,skill:'철벽'},{id:'gambler',name:'🎲 도박사',desc:'판정 주사위를 2개 굴리고 높은 값 사용. 체력이 낮다.',hp:25,str:0,def:0,focus:3,skill:'운명 조작'},{id:'mage',name:'✨ 마법사',desc:'집중 +2. 주문으로 확정 피해를 줄 수 있다.',hp:26,str:0,def:1,focus:5,skill:'마력 폭발'}];
const items=[{id:'sword',name:'무거운 검',desc:'힘 +2',str:2},{id:'shield',name:'강철 방패',desc:'방어 +2',def:2},{id:'ring',name:'정밀의 반지',desc:'모든 공격 판정 +3',hit:3},{id:'cloak',name:'회피 망토',desc:'모든 방어 판정 +3',evade:3},{id:'dagger',name:'독니 단검',desc:'공격 성공 시 추가 고정 피해 +3',bonus:3},{id:'amulet',name:'생명의 부적',desc:'최대 체력 +8, 즉시 8 회복',hp:8},{id:'dice',name:'행운의 주사위',desc:'전투마다 재굴림 +1',reroll:1},{id:'charm',name:'집중 부적',desc:'최대 집중 +2, 즉시 2 회복',focus:2},{id:'hammer',name:'균열 망치',desc:'방어 태세 중에도 다음 공격에 고정 피해 +2',steady:2},{id:'thorn',name:'가시 갑옷',desc:'방어 성공 시 반격 피해 +3',thorn:3},{id:'glove',name:'결투 장갑',desc:'공격 판정 +2, 힘 +1',hit:2,str:1},{id:'hourglass',name:'모래시계',desc:'매 전투 시작 시 집중 +1',regen:1}];
const foes=[{name:'동굴 쥐',hp:16,atk:5,guard:9,dmg:5},{name:'해골 병사',hp:23,atk:7,guard:11,dmg:7},{name:'고블린 척후병',hp:20,atk:8,guard:12,dmg:6},{name:'갑옷 망령',hp:29,atk:8,guard:13,dmg:8},{name:'심연의 추적자',hp:32,atk:10,guard:14,dmg:9},{name:'균열 기사',hp:38,atk:11,guard:15,dmg:10}];
const bosses=[{name:'👑 뼈의 군주',hp:52,atk:10,guard:13,dmg:10},{name:'👑 운명의 집행자',hp:73,atk:12,guard:15,dmg:12},{name:'👑 주사위의 왕',hp:95,atk:14,guard:16,dmg:14}];
let S=null;const save=()=>{if(S)localStorage.setItem('dice_dungeon_v1',JSON.stringify(S))};const load=()=>{try{const x=JSON.parse(localStorage.getItem('dice_dungeon_v1'));if(x&&x.version===1)S=x}catch(e){}};
const cls=()=>classes.find(x=>x.id===S.job),owned=id=>S.items.filter(x=>x===id).length,bonus=k=>S.items.reduce((a,id)=>a+(items.find(i=>i.id===id)?.[k]||0),0),maxhp=()=>cls().hp+bonus('hp'),maxfocus=()=>cls().focus+bonus('focus'),stat=k=>cls()[k]+bonus(k),heal=n=>{let d=Math.min(maxhp()-S.hp,n);S.hp+=d;return d},log=t=>{S.logs.unshift(t);S.logs=S.logs.slice(0,55)},dice=(kind,mod=0)=>{let a=roll(),b=S.job==='gambler'?roll():null;return {a,b,raw:b===null?a:Math.max(a,b),total:(b===null?a:Math.max(a,b))+mod}};
function start(job){S={version:1,job,hp:classes.find(c=>c.id===job).hp,focus:classes.find(c=>c.id===job).focus,coins:14,stage:1,items:[],phase:'path',enemy:null,logs:['모험이 시작되었다. 세 갈래 길에서 다음 방을 선택하자.'],rerolls:0,guard:false,steady:false,store:[],offers:[],last:null,kills:0};save();render()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',2100)}
function beginFight(boss=false){const base=boss?bosses[Math.min(2,Math.floor((S.stage-1)/5))]:foes[Math.min(foes.length-1,Math.floor((S.stage-1)/2)+rand(2))];const scale=boss?0:Math.floor((S.stage-1)/3)*3;S.enemy={...base,hp:base.hp+scale,maxhp:base.hp+scale,atk:base.atk+Math.floor(scale/3),dmg:base.dmg+Math.floor(scale/3),intent:rand(3)};S.phase='fight';S.rerolls=1+(S.job==='rogue'?1:0)+bonus('reroll');S.focus=clamp(S.focus+bonus('regen'),0,maxfocus());S.guard=false;S.steady=false;S.last=null;log(`⚔️ ${S.enemy.name} 등장! 상대의 다음 행동을 확인하자.`);save();render()}
function choosePath(type){if(S.phase!=='path')return;if(S.stage%5===0){beginFight(true);return}if(type==='fight'){beginFight();return}if(type==='treasure'){S.offers=pickItems(3);S.phase='treasure';log('✨ 보물방에서 유물 세 개를 발견했다. 하나를 고르자.')}else if(type==='rest'){S.phase='rest';log('🔥 모닥불이 보인다. 회복하거나 단련할 수 있다.')}else if(type==='shop'){S.store=pickItems(3);S.phase='shop';log('🛒 방랑 상인이 유물을 판매한다.')}save();render()}
function pickItems(n){return [...items].sort(()=>Math.random()-.5).slice(0,n).map(x=>x.id)}
function getItem(id){const i=items.find(x=>x.id===id);S.items.push(id);if(i.hp)S.hp+=i.hp;if(i.focus)S.focus+=i.focus;log(`🎁 ${i.name} 획득! ${i.desc}`)}
function nextRoom(){S.stage++;S.phase='path';S.enemy=null;S.last=null;S.guard=false;S.steady=false;save();render()}
function treasure(id){if(S.phase!=='treasure'||!S.offers.includes(id))return;getItem(id);nextRoom()}
function rest(which){if(S.phase!=='rest')return;if(which==='heal'){log(`🔥 체력을 ${heal(15+Math.floor(S.stage/2))} 회복했다.`)}else{S.focus=clamp(S.focus+3,0,maxfocus());S.coins+=5;log('🧘 집중 3과 금화 5를 얻었다.')}nextRoom()}
function buy(id){if(S.phase!=='shop'||!S.store.includes(id))return;const cost=20;if(S.coins<cost){toast('금화가 부족해!');return}S.coins-=cost;S.store.splice(S.store.indexOf(id),1);getItem(id);save();render()}
function attack(){if(S.phase!=='fight')return;const e=S.enemy;const d=dice('atk',stat('str')+bonus('hit'));const target=e.guard;const success=d.total>=target;let dmg=0;if(success){dmg=5+stat('str')+bonus('bonus')+(S.job==='rogue'?3:0)+(S.steady?bonus('steady'):0);e.hp=Math.max(0,e.hp-dmg)}S.last={type:'attack',d,target,success,dmg,rerollable:true};log(`🎲 공격 ${d.b===null?d.a:`${d.a}, ${d.b} → ${d.raw}`} + ${stat('str')+bonus('hit')} = ${d.total} / 목표 ${target} → ${success?`명중! ${dmg} 피해`:'빗나감'}`);S.steady=false;afterPlayer()}
function spell(){if(S.phase!=='fight'||S.focus<2)return;S.focus-=2;const dmg=8+(S.job==='mage'?6:0)+Math.floor(bonus('str')/2);S.enemy.hp=Math.max(0,S.enemy.hp-dmg);S.last={type:'spell',dmg,rerollable:false};log(`✨ 확정 주문! 주사위 없이 ${dmg} 피해. (집중 2)`);afterPlayer()}
function guard(){if(S.phase!=='fight')return;S.guard=true;S.steady=true;S.focus=clamp(S.focus+1,0,maxfocus());S.last={type:'guard',rerollable:false};log('🛡️ 방어 태세! 이번 적 공격 방어 판정 +5, 집중 +1.');afterPlayer()}
function heavy(){if(S.phase!=='fight'||S.focus<1)return;S.focus--;const d=dice('heavy',stat('str')+bonus('hit')+2);const success=d.total>=S.enemy.guard;const dmg=success?9+stat('str')+bonus('bonus')+(S.job==='rogue'?3:0):0;S.enemy.hp=Math.max(0,S.enemy.hp-dmg);S.last={type:'heavy',d,target:S.enemy.guard,success,dmg,rerollable:true};log(`💥 강타: ${d.raw} + ${stat('str')+bonus('hit')+2} = ${d.total} / 목표 ${S.enemy.guard} → ${success?`${dmg} 피해`:'실패'}`);afterPlayer()}
function afterPlayer(){if(S.enemy.hp<=0){winFight();return}enemyTurn();if(S.hp<=0){S.phase='dead';log('💀 모험이 끝났다. 다른 직업과 조합으로 다시 도전하자.')}save();render()}
function enemyTurn(){const e=S.enemy,mode=e.intent;const target=10+e.atk+(mode===1?2:0);const mod=stat('def')+bonus('evade')+(S.guard?5:0);const d=dice('def',mod);const success=d.total>=target;let dmg=mode===1?e.dmg+3:e.dmg;if(mode===2)dmg=Math.max(1,dmg-2);if(!success){S.hp=Math.max(0,S.hp-dmg);log(`💔 적의 ${['공격','강공격','견제'][mode]}! 방어 ${d.b===null?d.a:`${d.a}/${d.b}`} + ${mod} = ${d.total} / 목표 ${target} → ${dmg} 피해`)}else{log(`🛡️ 방어 성공! ${d.raw} + ${mod} = ${d.total} / 목표 ${target}`);const counter=(S.job==='guardian'?3:0)+bonus('thorn');if(counter){e.hp=Math.max(0,e.hp-counter);log(`↩️ 반격으로 확정 피해 ${counter}!`)}}S.last={type:'defense',d,target,success,dmg:success?0:dmg,rerollable:true,mode,mod};S.guard=false;e.intent=rand(3);if(e.hp<=0)winFight()}
function rerollDefense(){if(S.phase!=='fight'||S.rerolls<=0||S.last?.type!=='defense')return;S.rerolls--;const old=S.last;const d=dice('def',old.mod);const success=d.total>=old.target;if(success&&!old.success){S.hp=Math.min(maxhp(),S.hp+old.dmg);log(`🎲 재굴림 성공! ${d.raw} + ${old.mod} = ${d.total}. 받은 피해 ${old.dmg} 취소!`)}else{log(`🎲 재굴림 ${d.raw} + ${old.mod} = ${d.total}. ${success?'방어 성공':'여전히 실패'}.`)}S.last={...old,d,success:old.success||success,dmg:old.success||success?0:old.dmg,rerollable:false};save();render()}
function winFight(){const reward=9+S.stage*2;S.coins+=reward;S.kills++;S.phase='victory';log(`🏆 승리! 금화 ${reward} 획득. ${S.stage%5===0?'보스를 쓰러뜨렸다!':''}`);if(S.stage===15){S.phase='complete';log('👑 주사위의 왕을 무찔렀다! 던전 정복 성공!')}save();render()}
function abandon(){if(!confirm('현재 모험을 삭제하고 새로 시작할까?'))return;S=null;localStorage.removeItem('dice_dungeon_v1');render()}
function btn(text,fn,cl='',disabled=false){return `<button class="${cl}" ${disabled?'disabled':''} onclick="${fn}">${text}</button>`}
function panel(title,content,extra=''){return `<section class="panel ${extra}"><h2>${title}</h2>${content}</section>`}
function inventory(){return S.items.length?S.items.map(id=>{const i=items.find(x=>x.id===id);return `<div class="item"><b>${i.name}</b> · ${i.desc}</div>`}).join(''):'<span class="muted">아직 획득한 유물이 없습니다.</span>'}
function header(){return `<div class="panel"><div class="row spread"><div><span class="tag">${cls().name}</span> <span class="tag">${S.stage} / 15층</span> <span class="tag">🪙 ${S.coins}</span></div>${btn('새 모험','abandon()','danger')}</div><div class="row spread" style="margin-top:12px"><b>❤️ ${S.hp} / ${maxhp()}</b><b>✨ 집중 ${S.focus} / ${maxfocus()}</b></div><div class="bar"><div class="fill" style="width:${100*S.hp/maxhp()}%"></div></div><div class="row"><span class="stat">💪 힘 <b>${stat('str')}</b></span><span class="stat">🛡️ 방어 <b>${stat('def')}</b></span><span class="stat">🎯 공격 보정 <b>+${bonus('hit')}</b></span><span class="stat">🎲 재굴림 <b>${S.rerolls}</b></span></div></div>`}
function choiceCards(ids,mode){return `<div class="cards">${ids.map(id=>{const i=items.find(x=>x.id===id);return `<button class="card" onclick="${mode==='treasure'?`treasure('${id}')`:`buy('${id}')`}" ${mode==='shop'&&S.coins<20?'disabled':''}><strong>${i.name}</strong><small>${i.desc}</small><small style="margin-top:9px;color:#f5c96b">${mode==='treasure'?'무료 · 선택':'🪙 20 · 구매'}</small></button>`}).join('')}</div>`}
function content(){const e=S.enemy;switch(S.phase){case 'path':return panel(S.stage%5===0?'👑 보스의 문':`🚪 ${S.stage}층 · 다음 방 선택`,S.stage%5===0?`<p>보스가 기다리고 있다. 준비됐다면 도전하자.</p>${btn('⚔️ 보스에게 도전','choosePath(\'fight\')','primary')}`:`<p class="muted">한 방을 선택하면 다음 층으로 진행해. 전투 없이 아이템만 모으면 금화가 부족해질 수 있어.</p><div class="cards">${[['fight','⚔️ 전투','금화 획득 · 적과 싸운다'],['treasure','🎁 보물','유물 3개 중 1개 획득'],['rest','🔥 휴식','체력 회복 또는 집중 회복']].map(([id,t,d])=>`<button class="card" onclick="choosePath('${id}')"><strong>${t}</strong><small>${d}</small></button>`).join('')}${S.stage%3===0?`<button class="card" onclick="choosePath('shop')"><strong>🛒 상점</strong><small>금화로 유물을 구매한다</small></button>`:''}</div>`);case 'fight':return panel(`⚔️ ${e.name}`,`<div class="row spread"><b>❤️ ${e.hp} / ${e.maxhp()}</b><span class="tag">방어 난이도 ${e.guard}</span></div><div class="bar enemy"><div class="fill" style="width:${100*e.hp/e.maxhp}%"></div></div><p>👁️ 다음 행동: <b class="highlight">${['일반 공격','강공격 (+3 피해, 방어 난이도 +2)','견제 공격 (-2 피해)'][e.intent]}</b></p><p class="muted">적의 공격을 막으려면 D20 + 방어 보정 ≥ ${10+e.atk+(e.intent===1?2:0)}. 행동을 선택하면 적도 공격해.</p><div class="actions">${btn('⚔️ 기본 공격<small>명중 시 5 + 힘 + 추가 피해</small>','attack()')}${btn('💥 강타<small>집중 1 · 명중 +2 · 피해 +4</small>','heavy()','',S.focus<1)}${btn('✨ 확정 주문<small>집중 2 · 판정 없이 8 피해 (마법사 +6)</small>','spell()','',S.focus<2)}${btn('🛡️ 방어 태세<small>방어 +5 · 집중 +1</small>','guard()')}</div>${S.last?.type==='defense'?`<div class="panel" style="margin:13px 0 0"><b>🎲 마지막 방어 판정</b><p><span class="die">${S.last.d.raw}</span> + ${S.last.mod} = <b>${S.last.d.total}</b> / 목표 ${S.last.target} · ${S.last.success?'성공':'실패'}</p>${btn(`🎲 재굴림 (${S.rerolls}회 남음)<small>실패했던 방어를 다시 시도하여 피해 취소</small>`,`rerollDefense()`,'',S.rerolls<1||!S.last.rerollable||S.last.success)}</div>`:''}`);case 'treasure':return panel('🎁 유물 선택',`<p>세 유물 중 하나만 가져갈 수 있다. 같은 유물은 효과가 중첩된다.</p>${choiceCards(S.offers,'treasure')}`);case 'shop':return panel('🛒 방랑 상점',`<p>유물 하나당 금화 20. 여러 개 구매할 수 있다.</p>${choiceCards(S.store,'shop')}<p>${btn('상점을 떠나기','nextRoom()','primary')}</p>`);case 'rest':return panel('🔥 모닥불',`<p>한 가지 행동을 선택하자.</p><div class="actions">${btn('❤️ 휴식<small>체력 15 이상 회복</small>',"rest('heal')")}${btn('🧘 명상<small>집중 +3, 금화 +5</small>',"rest('focus')")}</div>`);case 'victory':return panel('🏆 승리!',`<p>전투에서 승리했다! 금화를 챙기고 다음 층으로 이동하자.</p>${btn('다음 층으로 →','nextRoom()','primary')}`);case 'dead':return panel('💀 모험 종료',`<p>${S.stage}층에서 모험이 끝났다. 쓰러뜨린 적: ${S.kills}명.</p><p>주사위 운만 믿지 말고 방어 보정, 확정 피해, 아이템 시너지를 활용해 보자.</p>${btn('새 모험 시작','abandon()','primary')}`);case 'complete':return panel('👑 던전 정복!',`<p>축하해! 15층의 주사위 왕을 무찔렀어. 총 ${S.kills}명의 적을 쓰러뜨렸다.</p>${btn('다른 직업으로 다시 도전','abandon()','primary')}`)}}
function render(){const app=$('#app');if(!S){app.innerHTML=panel('직업을 선택하세요',`<p>주사위는 D20을 사용해. 공격은 적의 방어 난이도 이상이면 성공하고, 방어는 적 공격 난이도 이상이면 피해를 막아. <b>확정 피해와 보정 아이템</b>으로 운의 영향을 줄이는 게 핵심이야.</p><div class="cards">${classes.map(c=>`<button class="card" onclick="start('${c.id}')"><strong>${c.name}</strong><small>${c.desc}</small><small style="margin-top:8px">❤️ ${c.hp} · 💪 ${c.str} · 🛡️ ${c.def} · ✨ ${c.focus}</small></button>`).join('')}</div>`)+panel('📖 전투 규칙',`<p><b>공격:</b> D20 + 힘 + 공격 보정 ≥ 적 방어 난이도 → 피해 발생.</p><p><b>방어:</b> D20 + 방어 + 회피 보정 ≥ 10 + 적 공격력 → 피해 0.</p><p><b>방어 재굴림:</b> 실패한 방어 판정을 전투당 정해진 횟수만큼 다시 굴려 피해를 되돌릴 수 있어.</p><p><b>확정 주문:</b> 집중을 소모해 주사위 없이 피해를 줘. 방어 태세는 집중을 회복하고 적 공격을 막기 쉽게 해 줘.</p>`);return}app.innerHTML=header()+`<div class="grid"><div>${content()}${panel('📜 모험 기록',`<div class="log">${S.logs.map(t=>`<div>${t}</div>`).join('')}</div>`)}</div><div>${panel('🎒 보유 유물',inventory())}${panel('📘 공략 팁',`<p class="muted">공격 보정은 명중률을 높이고, 힘은 명중 피해를 늘린다. 방어 보정은 적 공격의 피해를 0으로 만들 확률을 높인다.</p><p class="muted">수호자 + 가시 갑옷은 방어 성공 시 확정 반격 피해를 준다. 도적 + 독니 단검은 공격 성공 시 고정 피해가 크게 증가한다. 마법사는 확정 주문으로 높은 방어력의 적을 공략할 수 있다.</p>`)}</div></div>`;save()}
load();render();
</script></body></html>
