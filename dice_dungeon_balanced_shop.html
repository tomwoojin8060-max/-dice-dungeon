button:nth-child(even){border-radius:9px 17px 10px 15px;transform:rotate(.65deg)}button.primary{background:#ffc27e}button.secondary{background:#c9e5b4}button:disabled{filter:grayscale(.7)}button:active:not(:disabled){transform:translate(3px,4px) rotate(0);box-shadow:inset 1px 2px #7a5c40}button:focus-visible{outline:3px dashed #d87b40;outline-offset:3px}
#battleSection{position:relative}.arena{overflow:hidden}.arena .cell.player .sprite,.arena .cell.enemy .sprite{transition:transform .35s}.arena.hero-strike .cell.player .sprite{animation:bigSlash .85s ease-in-out}.arena.enemy-strike .cell.enemy .sprite{animation:bigSlashReverse .8s ease-in-out}.arena.hero-block .cell.player .sprite{animation:blockHero .8s ease-in-out}.arena hero{} .arena.enemy-hit .cell.enemy .sprite,.arena.hero-hit .cell.player .sprite{animation:shakeHero .65s ease-in-out}.arena .cell.player .sprite svg,.arena .cell.enemy .sprite svg{filter:drop-shadow(3px 4px 0 #6e503c66)}

/* hand-drawn controls, merchant and impact animation */
.uiIcon{width:19px;height:19px;vertical-align:middle;margin-right:5px;flex-shrink:0}
#actions button{display:flex;align-items:center;justify-content:center;gap:4px;min-height:49px;font-size:13px}
#actions button:nth-child(1){background:#f5ad7b}#actions button:nth-child(2){background:#b6d6a3}#actions button:nth-child(3){background:#e5b6ad}#actions button:nth-child(4){background:#b6cfe0}
.hitBurst{position:absolute;z-index:11;width:0;height:0;pointer-events:none;animation:burstFade .58s ease-out forwards}

.hitBurst i:nth-of-type(1){transform:rotate(0deg) translateY(-38px)}.hitBurst i:nth-of-type(2){transform:rotate(90deg) translateY(-38px)}.hitBurst i:nth-of-type(3){transform:rotate(180deg) translateY(-38px)}.hitBurst i:nth-of-type(4){transform:rotate(270deg) translateY(-38px)}
.hitBurst svg{position:absolute;left:-35px;top:-38px;width:70px;height:76px;overflow:visible}.hitBurst.blocked span{color:#a6e6ff;-webkit-text-stroke:2px #35799a}

function nearestEnemy(){
 return [...aliveEnemies()].sort((a,b)=>Math.abs(a.pos-s.playerPos)-Math.abs(b.pos-s.playerPos)||a.hp-b.hp||a.id-b.id)[0]||null;

function selectEnemy(id){if(busy||s.phase!=='battle')return;let e=aliveEnemies().find(x=>x.id===id);if(e){s.selectedEnemy=id;render();notice(`${e.name} 선택 · 거리 ${distance(e)}칸 · 체력 ${e.hp}`)}}
function spawn(){
 const late=s.cleared>=10, n=boardSize();
 const pool=late?['goblin','wolf','speed','ranger','archer','fierce']:['goblin','wolf'];
 const count=s.cleared<3?1:s.cleared<10?(Math.random()<.42?2:1):Math.random()<.24?3:(Math.random()<.7?2:1);
 const positions=Array.from({length:n-1},(_,i)=>i+1);
 s.enemies=[];
 for(let i=0;i<count&&positions.length;i++){

  let ix=rand(0,positions.length-1),pos=positions.splice(ix,1)[0];
  let names={goblin:'고블린',wolf:'던전 늑대',speed:'스피드 고블린',ranger:'레인저 고블린',archer:'해골 궁수',gold:'골드 고블린',fierce:'사나운 늑대'};
  let hp=7+Math.floor(s.cleared*1.05)+rand(0,2)+(kind==='fierce'?6:0);
  let damage=4+Math.floor(s.cleared*.35)+(kind==='fierce'?5:0);
  let range=kind==='archer'?6:kind==='ranger'?2:1;
  s.enemies.push({id:i+1,kind,name:names[kind],hp,maxHp:hp,damage,range,speed:['speed','fierce'].includes(kind)?2:1,pos,goldBonus:kind==='gold'?rand(22,38)+Math.floor(s.cleared/2):0});
 }
 s.playerPos=0;s.phase='battle';autoLock();

 const el=document.getElementById('stageFx');el.classList.remove('hidden');
 el.innerHTML=`<div class="fxcaption">${title}</div><div class="d20wrap ${rolling?'rolling':'stop'}"><svg viewBox="0 0 100 108" aria-label="20면체 주사위"><path d="M50 3 L94 32 L78 89 L50 105 L22 89 L6 32Z" fill="#fdf0c7" stroke="#3e3027" stroke-width="4" stroke-linejoin="round"/><path d="M50 3L29 37L6 32M50 3L71 37L94 32M29 37L71 37L50 78Z M6 32L29 37L22 89L50 105L50 78L78 89L71 37L94 32" fill="none" stroke="#9d7a55" stroke-width="2.5" stroke-linejoin="round"/><path d="M29 37L50 78L22 89M71 37L50 78L78 89" fill="none" stroke="#9d7a55" stroke-width="2"/><text x="50" y="59" text-anchor="middle" font-size="29" font-weight="1000" fill="#352c25">${num}</text></svg></div><div class="fxdetail">${detail}</div>`;

async function enemyTurn(){
 if(s.phase!=='battle')return;
 document.getElementById('turnIndicator').textContent='적의 차례';
 for(const e of [...aliveEnemies()]){
  if(s.phase!=='battle')break;
  const d=distance(e);
  if(d>e.range){
   const occupied=new Set(aliveEnemies().filter(x=>x.id!==e.id).map(x=>x.pos));
   const direction=e.pos>s.playerPos?-1:1;
   let moved=0;
   for(let k=0;k<(e.speed||1);k++){
    const next=e.pos+direction;
    if(next===s.playerPos||occupied.has(next)||next<0||next>=boardSize())break;
    e.pos=next;moved++;
   }
   if(moved){autoLock();log(`${e.name}: ${moved}칸 접근.`);notice(`${e.name}이(가) ${moved}칸 접근!`);render();await sleep(190);}
   if(e.kind!=='speed'||distance(e)>e.range)continue;
   notice('스피드 고블린이 이동 직후 공격!');
  }
  notice(`${e.name}의 공격! 방어 주사위를 굴려!`);
  animateSprite('enemy-strike');
  await sleep(100);
  const r=await rollScene('방어 주사위',`목표 15 · 행운 +${s.stats.luck}`);
  const total=r+s.stats.luck;
  if(total>=15){
   animateSprite('hero-block');hitBurst('player',true);floatNumber('방어!','player','block');
   log(`${e.name} 공격 방어! D20 ${r} + 행운 ${s.stats.luck} = ${total}`);
   notice(`${e.name} 공격 완전 방어! ${r}+${s.stats.luck}=${total}`);
  }else{
   const damage=Math.max(0,e.damage-s.stats.defense);
   s.hp=Math.max(0,s.hp-damage);
   animateSprite('hero-hit');if(s.hp>0){hitBurst('player');floatNumber('-'+damage,'player');}
   log(`${e.name} 공격! 방어 실패 (${r}+${s.stats.luck}=${total}). ${e.damage}-${s.stats.defense}=${damage} 피해.`);
   notice(`${e.name} 공격! <strong>체력 -${damage}</strong>`);
   if(s.hp<=0){await playerDeath();}
  }
  render();await sleep(220);fxHide();
 }

}

 if(e.hp>0)return false;
 e.hp=0;deathEffect('enemy',e.id);log(`${e.name} 처치!`);
 if(e.goldBonus){s.coins+=e.goldBonus;log(`골드 고블린 추가 보상 +${e.goldBonus} 코인!`);notice(`골드 고블린 처치! 보너스 ${e.goldBonus} 코인!`);}
 if(!aliveEnemies().length){win();return true;}
 autoLock();return false;
}
function win(){
 let gain=rand(8,15)+Math.floor(s.room/4);
 s.coins+=gain;s.cleared++;
 log(`${s.room}번 방 클리어! 기본 보상 ${gain} 코인.`);
 s.enemy=null;s.enemies=[];
 if(s.cleared>=50){s.phase='victory';notice('던전 정복!')}
 else if(s.cleared%5===0){
  s.phase='shop';s.shop=newShopStock();
  const recovered=Math.min(s.maxHp-s.hp,Math.ceil(s.maxHp/2));s.hp+=recovered;
  log(`상점 도착! 체력 ${recovered} 회복.`);
 }else{s.phase='cleared';notice(`승리! ${gain} 코인 획득. 다음 방으로!`)}
}
async function attack(){
 if(s.phase!=='battle'||busy)return;
 const e=selected();if(!e)return;
 const w=s.weapon;
 if(distance(e)>w.range){notice(`${e.name}까지 ${distance(e)}칸 · ${w.name} 사거리 ${w.range}칸! 이동하거나 다른 적을 선택해.`);return;}
 setBusy(true);closePanels();notice(`${e.name}에게 ${w.name} 공격!`);animateSprite('hero-strike');
 const r=await rollScene('공격 주사위',w.type==='magicweapon'?'마법 D12':'D20 · 힘과 행운 보정');
 const magic=w.type==='magicweapon',mr=magic?rand(1,12):0;
 const damage=Math.max(0,magic?mr+s.stats.magic+w.power:r+s.stats.luck+s.stats.strength+w.power);
 fxHide();animateSprite('enemy-hit');
 e.hp=Math.max(0,e.hp-damage);
 if(e.hp>0){hitBurst('enemy');floatNumber('-'+damage,'enemy');}
 const detail=magic?`D12 ${mr} + 마법 ${s.stats.magic} + 무기 ${w.power}`:`D20 ${r} + 행운 ${s.stats.luck} + 힘 ${s.stats.strength} + 무기 ${w.power}`;
 log(`${e.name}에게 ${damage} 피해! (${detail})`);notice(`${e.name} <strong>-${damage} HP</strong> (${detail})`);
 if(e.hp===0)defeatEnemy(e);
 render();await sleep(170);
 if(s.phase==='battle')await enemyTurn();
 render();setBusy(false);
}
async function move(dir,steps=1){
 if(s.phase!=='battle'||busy)return;
 steps=Math.max(1,Math.min(steps,s.moveRange||1));
 let next=s.playerPos;
 const occupied=new Set(aliveEnemies().map(e=>e.pos));
 for(let i=0;i<steps;i++){
  const candidate=next+dir;
  if(candidate<0||candidate>=boardSize()||occupied.has(candidate))break;
  next=candidate;
 }
 if(next===s.playerPos){notice('그 방향으로 이동할 수 없어.');return;}
 setBusy(true);const moved=Math.abs(next-s.playerPos);s.playerPos=next;
 log(`${dir>0?'앞':'뒤'}으로 ${moved}칸 이동.`);autoLock();closePanels();render();notice(`${moved}칸 이동!`);
 await sleep(170);await enemyTurn();render();setBusy(false);
}
function showMove(){
 if(busy)return;
 let p=document.getElementById('subpanel');p.classList.remove('hidden');p.dataset.mode='move';
 const range=s.moveRange||1;
 p.innerHTML=`<div class="notice">이동하면 적의 턴이 시작돼. 부츠 장착 시 한 번에 최대 ${range}칸 이동 가능!</div><div class="buttons" style="margin-top:8px">
 ${Array.from({length:range},(_,i)=>`<button onclick="move(-1,${i+1})">뒤로 ${i+1}칸</button><button onclick="move(1,${i+1})">앞으로 ${i+1}칸</button>`).join('')}</div>`;
}
function toggleInventory(){
 if(busy)return;
 let p=document.getElementById('subpanel');
 if(!p.classList.contains('hidden')&&p.dataset.mode==='inventory'){closePanels();return;}
 p.dataset.mode='inventory';p.classList.remove('hidden');
 let html=`<h2>소지품 · 확인은 턴 소모 없음</h2><div class="items">
 <div class="item">${itemIcon('blade')}<strong>${s.weapon.name}</strong><div>사거리 ${s.weapon.range}칸 · 공격 +${s.weapon.power}</div></div>
 <div class="item">${itemIcon('armor')}<strong>${s.armor}</strong><div>방어력 ${s.stats.defense}</div></div>
 <div class="item">${itemIcon('boots')}<strong>${s.moveRange>1?'여행자 부츠 장착':'기본 신발'}</strong><div>한 턴 이동 최대 ${s.moveRange||1}칸</div></div>`;
 for(let x of s.inventory){let it=item(x.id);if(it)html+=`<div class="item">${itemIcon(it.id)}<strong>${it.name} × ${x.qty}</strong><div>${it.desc}</div></div>`}
 html+='</div><button class="secondary" onclick="closePanels()" style="margin-top:9px">닫기</button>';p.innerHTML=html;
}
function showConsumables(){
 if(busy)return;
 let inShop=s.phase==='shop',p=document.getElementById(inShop?'shopPanel':'subpanel');
 if(!inShop){p.classList.remove('hidden');p.dataset.mode='use';}
 let inv=s.inventory.filter(x=>item(x.id)&&['heal','active'].includes(item(x.id).type));
 p.innerHTML=`<h2>아이템 사용</h2><div class="items">${inv.length?inv.map(x=>{let it=item(x.id);return `<div class="item">${itemIcon(it.id)}<strong>${it.name} × ${x.qty}</strong><div>${it.desc}</div><button onclick="useItem('${x.id}')">사용</button></div>`}).join(''):'<p class="muted">사용 가능한 아이템이 없어.</p>'}</div>${inShop?'':'<button class="secondary" onclick="closePanels()" style="margin-top:9px">닫기</button>'}`;
}
async function useItem(id){
 if(busy)return;
 let it=item(id),slot=s.inventory.find(x=>x.id===id);
 if(!it||!slot||slot.qty<=0||!['battle','shop'].includes(s.phase))return;
 if(it.type==='heal'&&s.hp===s.maxHp){notice('체력이 가득 차 있어.');return;}
 const battle=s.phase==='battle';if(battle)setBusy(true);
 slot.qty--;if(slot.qty<=0)s.inventory=s.inventory.filter(x=>x.qty>0);
 if(it.type==='heal'){
  const amount=Math.min(s.maxHp-s.hp,it.power+s.stats.vitality);s.hp+=amount;
  log(`${it.name} 사용 · 체력 ${amount} 회복.`);
  if(battle){notice(`체력 +${amount}! 적의 차례.`);floatNumber('+'+amount,'player','heal');render();await sleep(160);await enemyTurn();}
 }else if(it.type==='active'&&battle){
  const e=selected();
  if(e){e.hp=Math.max(0,e.hp-it.power);if(e.hp>0){hitBurst('enemy');floatNumber('-'+it.power,'enemy');}log(`${e.name}에게 ${it.power} 고정 피해 · 턴 유지.`);notice(`${e.name}에게 ${it.power} 피해!`);
   if(e.hp===0)defeatEnemy(e);
  }
 }
 if(s.phase==='shop')showConsumables();else closePanels();
 render();if(battle)setBusy(false);
}
function nextRoom(){if(s.phase!=='cleared')return;s.room++;spawn();render()}
function pick(existing=[]){
 // 회복 아이템은 일반 아이템보다 자주 등장하지만, 진열대 3칸 중 최대 1칸만 차지한다.
 const heals=catalog.filter(it=>it.type==='heal');
 const others=catalog.filter(it=>it.type!=='heal');
 const hasHeal=existing.some(id=>item(id)?.type==='heal');
 const pool=!hasHeal&&Math.random()<.32?heals:others;
 return pool[rand(0,pool.length-1)].id;
}
function newShopStock(){const stock=[];for(let i=0;i<3;i++)stock.push(pick(stock));return stock;}
function buy(index){if(s.phase!=='shop')return;let it=item(s.shop[index]);if(!it)return;if(s.coins<it.price){document.getElementById('shopPanel').textContent='🪙 코인이 부족해!';return}s.coins-=it.price;if(it.type==='boots'){s.moveRange=Math.max(s.moveRange||1,it.power);log('여행자 부츠 장착! 한 번에 2칸 이동 가능.')}else if(it.type==='weapon'||it.type==='magicweapon'){s.weaponBag.push({...s.weapon});s.weapon={name:it.name.replace(/^[^가-힣A-Za-z]+\\s*/,''),power:it.power,range:it.range,type:it.type};log(`${it.name} 장착! 이전 무기는 보관함으로 이동.`)}else if(it.type==='armor'){s.stats.defense+=it.power;s.armor=it.name.replace(/^[^가-힣A-Za-z]+\\s*/,'');log(`🛡️ ${it.name} 장착! 방어력 +${it.power}`)}else if(it.type==='stat'){let old=s.stats[it.stat];s.stats[it.stat]=it.stat==='luck'?Math.min(18,old+it.power):old+it.power;log(`${it.name} 획득! ${it.stat} +${s.stats[it.stat]-old}`)}else{let slot=s.inventory.find(x=>x.id===it.id);if(slot)slot.qty++;else s.inventory.push({id:it.id,qty:1});log(`🎒 ${it.name} 구매!`)}s.shop[index]=pick(s.shop.filter((_,i)=>i!==index));render()}
function weaponIconId(w){
 const name=(w?.name||'');
 return w?.type==='magicweapon'?'wand':name.includes('활')?'bow':name.includes('장검')?'longsword':'blade';
}
function equipStoredWeapon(index){
 if(s.phase!=='shop'||!Array.isArray(s.weaponBag)||!s.weaponBag[index])return;
 const old=s.weapon;s.weapon=s.weaponBag[index];s.weaponBag[index]=old;
 log(`무기 교체: ${s.weapon.name} 장착.`);
 render();
}
function sellStoredWeapon(index){
 if(s.phase!=='shop'||!s.weaponBag?.[index])return;
 const w=s.weaponBag.splice(index,1)[0];
 const base=catalog.find(it=>it.name.includes(w.name)&&['weapon','magicweapon'].includes(it.type));
 const price=Math.max(4,Math.floor((base?.price||12)*.5));
 s.coins+=price;log(`${w.name} 판매: +${price} 코인.`);
 render();
}
function renderWeaponExchange(){
 const bag=s.weaponBag||[];
 const weapon=s.weapon||{name:'나무 검',power:0,range:1,type:'weapon'};
 return `<div class="exchange"><div class="top"><strong>무기 보관함 · 상점에서 교체</strong><span class="muted">장착 중: ${weapon.name}</span></div>
 <div class="weaponCards">${bag.length?bag.map((w,i)=>`<div class="weaponCard">${itemIcon(weaponIconId(w))}<strong>${w.name}</strong><small>공격 +${w.power} · 사거리 ${w.range}칸</small><div class="weaponButtons"><button onclick="equipStoredWeapon(${i})">장착</button><button onclick="sellStoredWeapon(${i})">판매</button></div></div>`).join(''):'<p class="muted">보관한 무기가 없어. 새 무기를 구매하면 기존 무기가 여기에 보관돼.</p>'}</div></div>`;
}
function leaveShop(){if(s.phase!=='shop')return;s.room++;spawn();render()}
function closePanels(){let p=document.getElementById('subpanel');p.classList.add('hidden');p.dataset.mode='';p.innerHTML=''}
function restart(){
 busy=false;
 s=fresh();
 document.getElementById('arena').className='arena';
 document.getElementById('arena').innerHTML='';
 document.getElementById('stageFx').classList.add('hidden');
 document.getElementById('shopPanel').innerHTML='';
 closePanels();
 spawn();
 render();
 document.getElementById('turnIndicator').textContent='내 차례 · 행동을 골라줘';
 notice('새로운 모험이 시작됐어!');
 window.scrollTo?.({top:0,behavior:'smooth'});
}

function heldWeapon(){
 const w=s.weapon||{name:'나무 검',type:'weapon'};
 const id=weaponIconId(w);
 if(id==='bow')return '<path d="M69 17Q92 38 69 65M69 17V65M60 40L87 35M81 31L87 35 82 40" fill="none" stroke="#8a5b32" stroke-width="3"/>';
 if(id==='wand')return '<path d="M64 48L83 13" stroke="#77589d" stroke-width="6"/><path d="M83 4L86 11 94 13 86 16 83 24 79 16 72 13 79 10Z" fill="#a996e9" stroke="#55416b" stroke-width="2"/>';
 if(id==='longsword')return '<path d="M64 49L84 2 91 4 71 52Z" fill="#b6d5df" stroke="#485866" stroke-width="2"/><path d="M61 49L74 55" stroke="#9a673b" stroke-width="5"/>';
 if(w.name.includes('철'))return '<path d="M65 45L81 11 88 13 70 49Z" fill="#b3c5d5" stroke="#455e69" stroke-width="2"/><path d="M61 46L74 51" stroke="#9a673b" stroke-width="5"/>';
 return '<path d="M65 45L80 17 85 20 71 49Z" fill="#bd9869" stroke="#755438" stroke-width="2"/><path d="M61 46L74 51" stroke="#92623d" stroke-width="5"/>';

function doodle(kind){
 const wrap=(x)=>`<svg viewBox="0 0 90 90" xmlns="http://www.w3.org/2000/svg" aria-label="${kind} 손그림"><g stroke="#382e29" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">${x}</g></svg>`;
 if(kind==='hero')return wrap('<path fill="#765d49" d="M26 82L33 59 57 59 65 82 53 82 47 69 41 82Z"/><path fill="#67a7a4" d="M29 32Q45 23 61 32L59 64 30 64Z"/><path fill="#eec7a1" d="M31 16Q45 1 59 17L56 35 33 35Z"/><path fill="#b9bfc2" d="M30 17L37 7 54 7 62 18 57 22 33 22Z"/><path fill="none" d="M37 27h2m12 0h2"/><path fill="#eec7a1" d="M58 36L69 44 66 50 56 43Z"/>'+heldWeapon()+'<path fill="#a8bb79" d="M24 41Q8 40 14 60Q22 68 30 55Z"/>');
 if(kind==='speed')return wrap('<path fill="#5b9be3" d="M25 29L14 17 31 21Q45 12 59 22L77 14 67 36 69 65Q46 78 22 64Z"/><path fill="#9bd5fa" d="M31 42Q45 32 60 42L58 57Q45 64 31 57Z"/><path fill="#182f56" d="M32 36h8m12 0h8"/><path fill="none" d="M42 52l9-2M22 64L12 83M61 63L72 83M9 42l-7 6m8 1-7 6"/>');
 if(kind==='ranger')return wrap('<path fill="#bd5553" d="M23 30L15 12 33 21Q45 12 60 23L76 12 68 37 70 65Q46 80 22 64Z"/><path fill="#efb1a1" d="M30 42Q45 32 62 42L60 59Q46 67 30 59Z"/><path fill="#3c1d1b" d="M33 37h6m15 0h6"/><path fill="none" d="M43 52h8M69 25Q85 47 69 74M70 25v49M61 48l23-6"/><path fill="#9d5b45" d="M19 64L13 82M65 65L71 82"/>');
 if(kind==='gold')return wrap('<path fill="#e7bf45" d="M23 32L14 13 33 23Q45 13 60 23L76 13 68 39 70 65Q46 82 22 64Z"/><path fill="#ffe2a3" d="M30 43Q45 33 62 43L60 59Q46 66 30 58Z"/><path fill="#3e2b1b" d="M33 37h4m18 0h4"/><path fill="#e2a830" d="M45 53l8 0M23 65L17 82M65 65L71 82"/><circle cx="74" cy="52" r="9" fill="#f9e17a"/><path d="M74 47v10m-4-7h8" fill="none"/>');
 if(kind==='fierce')return wrap('<path fill="#734e45" d="M9 57Q13 34 30 40L37 13 50 33 67 18 67 41 83 52 73 67 26 67 22 84 13 83 16 64Z"/><path fill="#b98d79" d="M51 47L80 53 67 64 51 58Z"/><path fill="#e34d43" d="M53 44h8"/><path fill="#332b29" d="M70 56h6"/><path fill="#fff1dc" d="M60 60l5 10 5-10"/><path fill="none" d="M32 65L30 82M60 65L62 82"/>');
 if(kind==='archer')return wrap('<path fill="#e5d7b3" d="M33 60L27 83M55 60L63 83"/><path fill="#7b7b91" d="M30 35L59 35 56 65 33 65Z"/><path fill="#eee2bf" d="M30 16Q45 4 60 16L58 34 32 34Z"/><path fill="#242324" d="M35 22h6v5h-6zm13 0h6v5h-6z"/><path fill="none" d="M42 31h8M64 13Q83 42 64 70M65 13L65 70M55 44L78 40"/>');
 if(kind==='wolf')return wrap('<path fill="#918b86" d="M12 57Q16 37 33 40L40 21 49 35 63 28 66 43 79 51 72 62 28 65 22 81 17 80 17 64Z"/><path fill="#e6dfcf" d="M54 47L74 51 65 61 51 57Z"/><path fill="#272522" d="M54 45h4m13 8h2"/><path fill="none" d="M34 64L33 79M59 62L59 79"/>');
 return wrap('<path fill="#b1b879" d="M23 32L16 13 34 22Q47 14 60 24L76 13 68 39 70 65Q46 82 22 64Z"/><path fill="#f2d7a6" d="M30 43Q45 33 62 43L60 59Q46 66 30 58Z"/><path fill="#322b27" d="M33 37h4m18 0h4"/><path fill="none" d="M43 51Q47 55 51 51"/><path fill="#987457" d="M24 63L18 82M65 63L70 82"/><path fill="#b2b9bf" d="M74 34L83 23 87 27 77 40Z"/>');
}
let nextFx="";function effect(name){nextFx=name}
function render(){
 document.getElementById('location').textContent=`${s.room} / 50번 방 ${s.phase==='shop'?'· 상점':''}`;
 document.getElementById('coins').textContent=`코인 ${s.coins}`;
 document.getElementById('equipment').textContent=`${s.weapon.name} · ${s.armor} · 이동 ${s.moveRange||1}칸`;
 document.getElementById('hpLabel').textContent=`체력 ${s.hp} / ${s.maxHp}`;
 document.getElementById('hpbar').style.width=(s.hp/s.maxHp*100)+'%';
 document.getElementById('stats').innerHTML=[['힘','strength'],['행운','luck'],['방어','defense'],['마법','magic'],['활력','vitality']].map(([n,k])=>`<div class="stat">${n}<b>${s.stats[k]}</b></div>`).join('');
 document.getElementById('battleSection').classList.toggle('hidden',!['battle','cleared'].includes(s.phase));
 document.getElementById('shopSection').classList.toggle('hidden',s.phase!=='shop');
 document.getElementById('endSection').classList.toggle('hidden',!['dead','victory'].includes(s.phase));
 const alive=aliveEnemies(),e=selected();
 if(s.phase==='battle'&&e){
  document.getElementById('enemyTitle').textContent=`적 ${alive.length}마리 · 선택: ${e.name} · 사거리 ${e.range}`;
  document.getElementById('enemyHp').textContent=`선택한 적 체력 ${e.hp} / ${e.maxHp}`;
  let n=boardSize();document.getElementById('arena').style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
  document.getElementById('arena').innerHTML=Array.from({length:n},(_,i)=>{
   let monster=alive.find(x=>x.pos===i),isPlayer=i===s.playerPos;
   return `<div class="cell ${isPlayer?'player':''} ${monster?'enemy':''} ${monster&&monster.id===e.id?'target':''}" ${monster?`data-enemy-id="${monster.id}" onclick="selectEnemy(${monster.id})"`:''}>
    <span class="sprite">${isPlayer?doodle('hero'):monster?doodle(monster.kind):'<span class="floorMark">·</span>'}</span>
    <small>${monster?monster.hp+'/'+monster.maxHp+' HP':(i+1)+'칸'}</small>
    ${monster?`<span class="monsterLabel">${monster.name}</span>`:''}</div>`;
  }).join('');
  document.getElementById('distance').textContent=`자동 조준: 가장 가까운 적 · 거리 ${distance(e)}칸 · 직접 선택도 가능`;
  document.getElementById('range').textContent=`${s.weapon.name} 사거리 ${s.weapon.range}칸`;
 }
 document.getElementById('actions').innerHTML=s.phase==='cleared'?'<button class="primary" onclick="nextRoom()" style="grid-column:1/-1">'+uiIcon('next')+' 다음 방</button>':
 '<button class="primary" onclick="attack()">'+uiIcon('sword')+' 공격</button><button class="secondary" onclick="toggleInventory()">'+uiIcon('bag')+' 장비 보기</button><button class="secondary" onclick="showConsumables()">'+uiIcon('potion')+' 아이템 사용</button><button onclick="showMove()">'+uiIcon('walk')+' 이동</button>';
 if(s.phase==='shop'){
  document.getElementById('shopItems').innerHTML=s.shop.map((id,i)=>{
   let it=item(id);return `<div class="item">${itemIcon(it.id)}<strong>${it.name}</strong><div class="muted">${it.desc}</div><p class="tag">${it.price} 코인</p><button onclick="buy(${i})" ${s.coins<it.price?'disabled':''}>구매</button></div>`;
  }).join('');
  document.getElementById('weaponExchange').innerHTML=renderWeaponExchange();
 }
 if(s.phase==='dead'){document.getElementById('deathBadge').innerHTML=skullSVG;document.getElementById('endTitle').textContent='모험 실패';document.getElementById('endMessage').textContent=`${s.room}번 방에서 쓰러졌어.`}
 if(s.phase==='victory'){document.getElementById('deathBadge').innerHTML='';document.getElementById('endTitle').textContent='던전 정복!';document.getElementById('endMessage').textContent='50개 방을 모두 클리어했어!'}
 document.getElementById('log').style.maxHeight=fullLog?'27dvh':'62px';
 document.getElementById('log').innerHTML=s.logs.slice(0,fullLog?35:3).map(x=>`<p>${x}</p>`).join('');
 document.getElementById('actions').classList.toggle('busy',busy);
 save();
}
render();
</script></body></html>
